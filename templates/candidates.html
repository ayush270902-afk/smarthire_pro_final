<!DOCTYPE html>
<html>
<head>

    <title>Candidates</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#eef2ff;
            font-family:Segoe UI;
        }

        .main{
            max-width:1200px;
            margin:auto;
            margin-top:40px;
        }

        .card{
            border:none;
            border-radius:18px;
        }

        .badge{
            padding:8px 14px;
        }

    </style>

</head>

<body>

<div class="main">

    <div class="d-flex justify-content-between mb-4">

        <h2>
            <i class="fa fa-users"></i>
            Candidate Management
        </h2>

        <a href="/" class="btn btn-dark">
            Dashboard
        </a>

    </div>

    <!-- Form -->

    <div class="card shadow-sm p-4 mb-4">

        <h4>Add Candidate</h4>

        <form method="POST">

            <div class="row">

                <div class="col-md-4">
                    <input type="text"
                    name="name"
                    class="form-control"
                    placeholder="Candidate Name"
                    required>
                </div>

                <div class="col-md-4">
                    <input type="text"
                    name="skill"
                    class="form-control"
                    placeholder="Primary Skill"
                    required>
                </div>

                <div class="col-md-4">
                    <button class="btn btn-primary w-100">
                        Add Candidate
                    </button>
                </div>

            </div>

        </form>

    </div>

    <!-- Table -->

    <div class="card shadow-sm p-4">

        <h4 class="mb-3">Candidate List</h4>

        <table class="table table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Skill</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                {% for c in data %}

                <tr>

                    <td>{{c.id}}</td>

                    <td>{{c.name}}</td>

                    <td>{{c.skill}}</td>

                    <td>

                        {% if c.status == 'Selected' %}

                        <span class="badge bg-success">
                            {{c.status}}
                        </span>

                        {% elif c.status == 'Rejected' %}

                        <span class="badge bg-danger">
                            {{c.status}}
                        </span>

                        {% else %}

                        <span class="badge bg-warning text-dark">
                            {{c.status}}
                        </span>

                        {% endif %}

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
