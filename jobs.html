<!DOCTYPE html>
<html>
<head>
    <title>Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#f4f7fc;
            font-family:Segoe UI;
        }

        .container-box{
            max-width:1100px;
            margin:auto;
            margin-top:40px;
        }

        .card{
            border:none;
            border-radius:18px;
        }

        .table{
            border-radius:12px;
            overflow:hidden;
        }

    </style>

</head>

<body>

<div class="container-box">

    <div class="d-flex justify-content-between mb-4">

        <h2>
            <i class="fa fa-briefcase"></i>
            Job Management
        </h2>

        <a href="/" class="btn btn-dark">
            Dashboard
        </a>

    </div>

    <!-- Add Job -->

    <div class="card shadow-sm p-4 mb-4">

        <h4 class="mb-3">Add New Job</h4>

        <form method="POST">

            <div class="row">

                <div class="col-md-5">
                    <input type="text"
                    name="title"
                    class="form-control"
                    placeholder="Job Title"
                    required>
                </div>

                <div class="col-md-5">
                    <input type="text"
                    name="dept"
                    class="form-control"
                    placeholder="Department"
                    required>
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100">
                        Add
                    </button>
                </div>

            </div>

        </form>

    </div>

    <!-- Table -->

    <div class="card shadow-sm p-4">

        <h4 class="mb-3">Available Jobs</h4>

        <table class="table table-hover">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Department</th>
                </tr>

            </thead>

            <tbody>

                {% for j in data %}

                <tr>
                    <td>{{j.id}}</td>
                    <td>{{j.title}}</td>
                    <td>{{j.dept}}</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
