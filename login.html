<!DOCTYPE html>
<html>
<head>

    <title>SmartHire Pro Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{

            margin:0;
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(
                135deg,
                #2563eb,
                #1e3a8a
            );

            font-family:Segoe UI;
        }

        .login-box{

            width:400px;

            background:white;

            padding:40px;

            border-radius:24px;

            box-shadow:0 10px 30px rgba(0,0,0,0.2);

        }

        .logo{

            text-align:center;
            margin-bottom:30px;

        }

        .logo i{

            font-size:50px;
            color:#2563eb;

        }

        .logo h2{

            margin-top:10px;
            font-weight:bold;

        }

        .form-control{

            border-radius:12px;
            padding:12px;

        }

        .btn-login{

            background:#2563eb;
            color:white;
            border:none;

            padding:12px;

            border-radius:12px;

            width:100%;

            font-weight:bold;

            transition:0.3s;
        }

        .btn-login:hover{

            background:#1e40af;

        }

    </style>

</head>

<body>

<div class="login-box">

    <!-- Logo -->

    <div class="logo">

        <i class="fa fa-user-tie"></i>

        <h2>SmartHire Pro</h2>

        <p class="text-muted">
            Recruitment Management System
        </p>

    </div>

    <!-- Form -->

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input type="text"
            name="username"
            class="form-control"
            placeholder="Enter Username"
            required>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input type="password"
            name="password"
            class="form-control"
            placeholder="Enter Password"
            required>

        </div>

        <button class="btn-login">

            <i class="fa fa-sign-in-alt"></i>

            Login

        </button>

    </form>

</div>

</body>
</html>
