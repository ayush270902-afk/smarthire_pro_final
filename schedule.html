<!DOCTYPE html>
<html>
<head>

    <title>Interview Scheduler</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#f4f7fc;
            font-family:Segoe UI;
        }

        .main{
            max-width:1100px;
            margin:auto;
            margin-top:40px;
        }

        .card{
            border:none;
            border-radius:20px;
        }

        .table{
            border-radius:12px;
            overflow:hidden;
        }

        .header-box{
            background:linear-gradient(135deg,#2563eb,#1e3a8a);
            color:white;
            padding:30px;
            border-radius:20px;
            margin-bottom:30px;
        }

    </style>

</head>

<body>

<div class="main">

    <!-- Header -->

    <div class="header-box shadow">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h2>
                    <i class="fa fa-calendar-check"></i>
                    Interview Scheduler
                </h2>

                <p>
                    Manage and track candidate interview schedules
                </p>

            </div>

            <a href="/" class="btn btn-light">
                Dashboard
            </a>

        </div>

    </div>

    <!-- Form -->

    <div class="card shadow-sm p-4 mb-4">

        <h4 class="mb-4">
            Schedule Interview
        </h4>

        <form method="POST">

            <div class="row g-3">

                <div class="col-md-5">

                    <input type="text"
                    name="name"
                    class="form-control"
                    placeholder="Candidate Name"
                    required>

                </div>

                <div class="col-md-5">

                    <input type="date"
                    name="date"
                    class="form-control"
                    required>

                </div>

                <div class="col-md-2">

                    <button class="btn btn-primary w-100">
                        Schedule
                    </button>

                </div>

            </div>

        </form>

    </div>

    <!-- Table -->

    <div class="card shadow-sm p-4">

        <h4 class="mb-3">
            Scheduled Interviews
        </h4>

        <table class="table table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Candidate</th>
                    <th>Interview Date</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                {% for i in data %}

                <tr>

                    <td>{{i.id}}</td>

                    <td>{{i.name}}</td>

                    <td>{{i.date}}</td>

                    <td>

                        <span class="badge bg-primary">
                            Scheduled
                        </span>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
